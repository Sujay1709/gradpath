<!doctype html>

<head>

<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <symbol id="i-plan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>

  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-5"/><path d="M12 16V8"/><path d="M16 16v-3"/></symbol>

<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/" data-link>
      <svg class="icon icon--brand" aria-hidden="true"><use href="#i-school"/></svg>
      <span>GradPath</span>
    </a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="primary-nav">
      <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg><span>Menu</span>
    </button>
    <nav id="primary-nav" class="primary-nav" aria-label="GradPath"></nav>
  </div>
</header>

<main id="main" class="page" tabindex="-1"></main>

<footer class="site-footer">
  <p>Outcomes: U.S. Department of Education, College Scorecard (release Oct 2026; graduates of 2021–22, earnings measured 2023–24).
    State taxes: official state revenue pages, tax year 2025. Educational estimates, not financial or tax advice.</p>
</footer>

<div id="announcer" class="visually-hidden" aria-live="polite"></div>

<dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title" class="dialog__title"></h2>
    <p id="confirm-body"></p>
    <div class="dialog__actions">
      <button class="button button--secondary" value="cancel">Keep my answers</button>
      <button class="button button--danger" value="confirm" id="confirm-ok">Clear</button>
    </div>
  </form>
</dialog>

<script type="module" src="/static/app/app.js"></script>
</body>
</html>
