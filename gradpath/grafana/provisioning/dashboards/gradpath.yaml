apiVersion: 1

# One provider per Grafana folder. Dashboards are generated by grafana/build_dashboards.py.
# Students use the GradPath app on port 8000; these folders are for admins and analysts.
providers:
  - name: GradPath
    orgId: 1
    folder: GradPath
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /Users/sujaygopal/Desktop/MyProjects/IBM_BOB/gradpath/grafana/dashboards/main

  - name: GradPath Detail Views
    orgId: 1
    folder: GradPath Detail Views
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /Users/sujaygopal/Desktop/MyProjects/IBM_BOB/gradpath/grafana/dashboards/detail

  - name: GradPath Legacy
    orgId: 1
    folder: GradPath Legacy
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /Users/sujaygopal/Desktop/MyProjects/IBM_BOB/gradpath/grafana/dashboards/legacy
