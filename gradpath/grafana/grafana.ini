# GradPath Grafana configuration override
# Place this file at: gradpath/grafana/grafana.ini

[server]
http_port = 3000
domain = localhost

[paths]
data = /opt/homebrew/var/lib/grafana
logs = /opt/homebrew/var/log/grafana
plugins = /opt/homebrew/var/lib/grafana/plugins
provisioning = /Users/sujaygopal/Desktop/MyProjects/IBM_BOB/gradpath/grafana/provisioning

[auth.anonymous]
# Allow anyone on localhost to view dashboards without login
enabled = true
org_role = Viewer

[security]
# Disable login form for local dev
disable_initial_admin_creation = false

[plugins]
allow_loading_unsigned_plugins = marcusolsson-json-datasource
